<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

    <meta property="og:image" content="https://pnrtscr.com/lightshot.png">
    <meta property="og:description" content="Captured with Lightshot">
    <meta property="og:type" content="website">

    <meta name="twitter:title" content="Screenshot">
    <meta name="twitter:site" content="@light_shot">
    <meta name="twitter:description" content="Captured with Lightshot">
    <meta name="twitter:image:src" content="https://pnrtscr.com/lightshot.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;900&display=swap" rel="stylesheet">
    
    <style type="text/css">
        p {
            margin: 0;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 0;
        }

        .overlay, .scare {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
        }

        p.overlay-title {
            font-size: 64px;
            font-weight: 900;
            color: white;
            line-height: 1;
            margin-bottom: 32px;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .overlay-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 85px;
            min-width: 300px;
            padding-right: 48px;
            padding-left: 48px;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .overlay-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg) translate(-100%, -100%);
            transition: transform 0.6s ease;
        }

        .overlay-button:hover::after {
            transform: rotate(30deg) translate(100%, 100%);
        }

        .overlay-button:hover {
            transform: translateY(-4px);
        }

        .overlay-button:active {
            transform: translateY(-1px);
        }

        .overlay-buttons-wrapper {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        #accept-button {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: white;
            border: 1px solid rgba(74, 222, 128, 0.4);
            box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.4), 0 8px 10px -6px rgba(34, 197, 94, 0.4);
        }

        #accept-button:hover {
            background: linear-gradient(135deg, #16a34a 0%, #166534 100%);
            box-shadow: 0 15px 30px -5px rgba(34, 197, 94, 0.6), 0 10px 15px -5px rgba(34, 197, 94, 0.5);
        }

        #decline-button {
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            color: white;
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4), 0 8px 10px -6px rgba(14, 165, 233, 0.4);
        }

        #decline-button:hover {
            background: linear-gradient(135deg, #0284c7 0%, #075985 100%);
            box-shadow: 0 15px 30px -5px rgba(14, 165, 233, 0.6), 0 10px 15px -5px rgba(14, 165, 233, 0.5);
        }

        .overlay-body {
            max-width: 90vw;
            text-align: center;
            z-index: 3;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .overlay.hidden {
            display: none;
        }

        /* Nowe tło z nastrojową niebiesko-zieloną poświatą */
        .overlay {
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 25% 35%, rgba(34, 197, 94, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 75% 65%, rgba(14, 165, 233, 0.25) 0%, transparent 50%);
            padding-right: 24px;
            padding-left: 24px;
        }

        .scare {
            z-index: 1;
        }

        video#video {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }

        video#video::-webkit-media-controls-enclosure {
            display: none !important;
        }
    </style>
</head>
<body>
<div id="overlay" class="overlay">
    <div class="overlay-body">
        <p class="overlay-title">kasper12e</p>
        <div class="overlay-buttons-wrapper">
            <div id="accept-button" class="overlay-button">KICK</div>
            <div id="decline-button" class="overlay-button">Kod CSGOSKINS</div>
        </div>
    </div>
</div>
<div class="scare">
    <video id="video" class="video" src="video.mp4" loop=""></video>
</div>

<script type="text/javascript">
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const declineButton = document.getElementById("decline-button");
    const acceptButton = document.getElementById("accept-button");

    let hasClicked;

    window.onbeforeunload = function() {
        if(hasClicked) return true;
    };

    function pobierzObrazek1() {
        const link = document.createElement("a");
        link.href = "obrazek1.png";
        link.download = "obrazek1.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function buttonClick(event) {
        event.preventDefault();
        if(!hasClicked) hasClicked = true;
        overlay.classList.add("hidden");
        video.play();
        videoClick();
        pobierzObrazek1();
    }

    function videoClick(event) {
        if(event) event.preventDefault();
        const { documentElement } = document;
        if(documentElement.requestFullscreen) documentElement.requestFullscreen();
        else if(documentElement.mozRequestFullScreen) documentElement.mozRequestFullScreen();
        else if(documentElement.webkitRequestFullscreen) documentElement.webkitRequestFullscreen();
        else if(documentElement.msRequestFullscreen) documentElement.msRequestFullscreen();
    }

    acceptButton.addEventListener("click", buttonClick);
    declineButton.addEventListener("click", buttonClick);
    video.addEventListener("click", videoClick);
</script>

<script>
    fetch('/api/kasper');
</script>

</body>
</html>
